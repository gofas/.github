name: Build and attach release asset

on:
  workflow_call:
    inputs:
      module_name:
        description: "Nome do modulo (nome do zip e da pasta raiz dentro dele)"
        required: true
        type: string
      include_paths:
        description: "Diretorios do repo que entram no zip, separados por espaco"
        required: false
        type: string
        default: "modules includes"

jobs:
  build_asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout da tag da release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1

      - name: Montar o zip
        env:
          MODULE_NAME: ${{ inputs.module_name }}
          INCLUDE_PATHS: ${{ inputs.include_paths }}
        run: |
          set -euo pipefail
          staging="$(mktemp -d)/${MODULE_NAME}"
          mkdir -p "$staging"
          copiados=0
          for p in ${INCLUDE_PATHS}; do
            if [ -e "$p" ]; then
              cp -a "$p" "$staging/"
              copiados=$((copiados+1))
              echo "incluido: $p"
            else
              echo "ignorado (nao existe no repo): $p"
            fi
          done
          if [ "$copiados" -eq 0 ]; then
            echo "ERRO: nenhum diretorio incluido, o zip ficaria vazio" >&2
            exit 1
          fi
          find "$staging" -name '.DS_Store' -delete
          ( cd "$(dirname "$staging")" && zip -qr "${GITHUB_WORKSPACE}/${MODULE_NAME}.zip" "${MODULE_NAME}" )
          echo "--- conteudo do zip ---"
          unzip -l "${GITHUB_WORKSPACE}/${MODULE_NAME}.zip" | tail -5

      - name: Anexar o zip a release
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          MODULE_NAME: ${{ inputs.module_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "${MODULE_NAME}.zip" --clobber --repo "${GITHUB_REPOSITORY}"
          echo "asset ${MODULE_NAME}.zip anexado a release ${TAG}"
